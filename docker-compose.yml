services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: ecoshop
      POSTGRES_USER: ecoshop
      POSTGRES_PASSWORD: ecoshop
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecoshop
      SPRING_DATASOURCE_USERNAME: ecoshop
      SPRING_DATASOURCE_PASSWORD: ecoshop
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
